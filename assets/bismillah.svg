<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F"/>
      <stop offset="25%" stop-color="#FCF6BA"/>
      <stop offset="50%" stop-color="#B38728"/>
      <stop offset="75%" stop-color="#FBF5B7"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <linearGradient id="softGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="shamsaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDF8E8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#F4ECE1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0"/>
    </radialGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#2C2523" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ambient Shamsa Glow -->
  <ellipse cx="270" cy="110" rx="240" ry="85" fill="url(#shamsaGlow)"/>

  <!-- Left & Right Decorative Flourish Finials (Manuscript Palmettes) -->
  <g stroke="url(#goldSheen)" stroke-width="1.2" fill="none">
    <!-- Left Wing -->
    <path d="M 90 110 C 60 110, 40 100, 20 110 C 40 120, 60 110, 90 110 Z"/>
    <path d="M 50 110 C 35 95, 20 90, 5 95 C 15 105, 30 108, 50 110 Z"/>
    <path d="M 50 110 C 35 125, 20 130, 5 125 C 15 115, 30 112, 50 110 Z"/>
    <circle cx="5" cy="95" r="2" fill="url(#goldSheen)"/>
    <circle cx="5" cy="125" r="2" fill="url(#goldSheen)"/>
    <circle cx="15" cy="110" r="2.5" fill="url(#goldSheen)"/>

    <!-- Right Wing -->
    <path d="M 450 110 C 480 110, 500 100, 520 110 C 500 120, 480 110, 450 110 Z"/>
    <path d="M 490 110 C 505 95, 520 90, 535 95 C 525 105, 510 108, 490 110 Z"/>
    <path d="M 490 110 C 505 125, 520 130, 535 125 C 525 115, 510 112, 490 110 Z"/>
    <circle cx="535" cy="95" r="2" fill="url(#goldSheen)"/>
    <circle cx="535" cy="125" r="2" fill="url(#goldSheen)"/>
    <circle cx="525" cy="110" r="2.5" fill="url(#goldSheen)"/>
  </g>

  <!-- Central Cartouche / Shamsa Border -->
  <!-- Outer hairline cartouche -->
  <path d="M 120 110 C 120 70, 160 50, 270 50 C 380 50, 420 70, 420 110 C 420 150, 380 170, 270 170 C 160 170, 120 150, 120 110 Z"
        fill="none" stroke="#2C2523" stroke-width="0.75" stroke-opacity="0.4"/>
        
  <!-- Intermediate gilded cartouche with scalloped lobing -->
  <path d="M 126 110 C 126 75, 164 56, 270 56 C 376 56, 414 75, 414 110 C 414 145, 376 164, 270 164 C 164 164, 126 145, 126 110 Z"
        fill="none" stroke="url(#goldSheen)" stroke-width="1.8"/>

  <!-- Inner delicate beaded hairline -->
  <path d="M 132 110 C 132 80, 168 62, 270 62 C 372 62, 408 80, 408 110 C 408 140, 372 158, 270 158 C 168 158, 132 140, 132 110 Z"
        fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.8"/>

  <!-- Top and Bottom Crown Finials -->
  <g fill="url(#goldSheen)" stroke="none">
    <!-- Top Crown -->
    <path d="M 270 38 L 274 46 L 270 54 L 266 46 Z"/>
    <circle cx="270" cy="34" r="2"/>
    <circle cx="258" cy="48" r="1.5"/>
    <circle cx="282" cy="48" r="1.5"/>

    <!-- Bottom Crown -->
    <path d="M 270 182 L 274 174 L 270 166 L 266 174 Z"/>
    <circle cx="270" cy="186" r="2"/>
    <circle cx="258" cy="172" r="1.5"/>
    <circle cx="282" cy="172" r="1.5"/>
  </g>

  <!-- Vector Calligraphic Masterpiece: Bismillah al-Rahman al-Rahim (بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ) -->
  <g fill="#2C2523" filter="url(#subtleShadow)">
    <!-- High-elegance Naskh/Thuluth styled vector path rendering -->
    <!-- Center text composition with Arabic ligatures -->
    <g transform="translate(270, 122) scale(0.92)">
      <!-- Main Calligraphy Strokes rendered with calligraphic pen angles -->
      <!-- Bismillah: Ba-Seen-Meem, Allah, Ar-Rahman, Ar-Rahim -->
      
      <!-- Allah vertical alifs & lams -->
      <!-- Alif of Allah -->
      <path d="M -75 -35 C -75 -40, -73 -44, -70 -48 C -68 -46, -69 -38, -69 -22 L -69 2 C -69 8, -73 10, -75 9 C -76 7, -75 0, -75 -35 Z"/>
      <!-- Lam 1 -->
      <path d="M -54 -38 C -54 -42, -52 -46, -49 -48 C -47 -46, -48 -40, -48 -20 L -48 6 C -48 10, -52 11, -54 9 C -55 7, -54 0, -54 -38 Z"/>
      <!-- Lam 2 & Ha of Allah -->
      <path d="M -34 -34 C -34 -38, -32 -42, -29 -44 C -27 -42, -28 -36, -28 -18 L -28 0 C -28 12, -18 14, -12 10 C -7 7, -5 2, -5 -5 C -5 -14, -15 -18, -25 -16 L -25 -20 C -12 -22, 2 -16, 2 -4 C 2 8, -8 18, -22 18 C -36 18, -36 8, -36 -2 L -34 -34 Z"/>
      
      <!-- Ba-Seen-Meem (Bism) starting on the right -->
      <!-- Ba tooth -->
      <path d="M 120 -28 C 120 -33, 123 -37, 126 -39 C 128 -37, 127 -30, 127 -18 L 127 2 C 127 7, 122 8, 120 7 C 119 5, 120 0, 120 -28 Z"/>
      <!-- Seen teeth -->
      <path d="M 112 -12 C 112 -16, 114 -20, 117 -22 C 119 -20, 118 -15, 118 -8 L 118 4 C 114 6, 110 5, 108 2 L 108 -14 C 108 -18, 110 -22, 113 -24 C 115 -22, 114 -17, 114 -10 L 114 4 C 110 6, 104 6, 100 2 L 100 -12 C 100 -17, 103 -21, 106 -23 C 108 -21, 106 -16, 106 -9 L 106 3 C 98 7, 90 7, 84 2 L 78 -2 C 72 -6, 68 -10, 68 -16 C 68 -24, 76 -28, 86 -26 C 94 -24, 98 -18, 96 -12 C 95 -7, 90 -4, 84 -5 C 79 -6, 76 -10, 77 -14 C 78 -18, 83 -20, 87 -19 C 89 -19, 89 -17, 88 -15 C 87 -14, 84 -13, 82 -11 C 80 -8, 83 -4, 88 -3 C 93 -2, 98 -4, 101 -8 L 101 -2 C 95 6, 85 9, 74 6 L 68 3 L 64 8 C 60 14, 52 18, 42 16 L 36 14 L 32 17 C 22 23, 8 22, -2 16 L -10 14 C -18 13, -25 15, -34 16 L -58 17 C -64 17, -72 15, -78 12 L -92 12 C -102 12, -114 10, -124 5 Z"/>
      <!-- Nuqta (Dot of Ba) -->
      <path d="M 124 16 L 129 11 L 134 16 L 129 21 Z" fill="url(#goldSheen)"/>

      <!-- Ar-Rahman (الرحمن) -->
      <!-- Alif of Ar-Rahman -->
      <path d="M 24 -36 C 24 -41, 26 -45, 29 -47 C 31 -45, 30 -39, 30 -20 L 30 5 C 30 9, 26 11, 24 9 C 23 7, 24 0, 24 -36 Z"/>
      <!-- Lam -->
      <path d="M 40 -34 C 40 -39, 42 -43, 45 -45 C 47 -43, 46 -37, 46 -18 L 46 4 C 44 8, 38 9, 36 8 L 40 -34 Z"/>
      <!-- Ra of Rahman sweeping base -->
      <path d="M 52 4 C 54 -2, 58 -6, 64 -6 C 70 -6, 73 -1, 72 6 C 70 14, 62 23, 48 27 C 38 30, 26 31, 14 30 C 5 29, -6 26, -14 23 L -12 18 C -4 21, 6 23, 15 24 C 28 25, 42 23, 50 18 C 58 13, 62 8, 62 4 C 62 0, 58 0, 56 3 Z"/>
      <!-- Ha and Meem of Rahman -->
      <path d="M 10 -4 C 15 -9, 21 -12, 28 -12 C 34 -12, 38 -8, 37 -2 C 36 4, 30 8, 22 9 C 14 10, 6 8, 0 3 C -6 -2, -10 -8, -8 -15 C -6 -22, 2 -26, 12 -25 C 20 -24, 25 -19, 24 -13 C 23 -8, 18 -6, 13 -7 C 9 -8, 7 -12, 8 -15 C 9 -18, 14 -19, 17 -18 C 18 -17, 18 -15, 17 -14 C 16 -13, 14 -13, 13 -11 C 12 -9, 14 -7, 18 -7 C 22 -7, 26 -11, 25 -16 C 24 -20, 18 -23, 11 -22 C 3 -21, -3 -17, -4 -11 C -5 -6, -2 -1, 4 3 L 10 -4 Z"/>
      <!-- Noon of Rahman with floating dot -->
      <path d="M -70 12 C -65 18, -55 24, -42 26 C -30 28, -16 27, -4 23 L -6 18 C -16 21, -28 22, -38 21 C -49 19, -58 15, -63 10 Z"/>
      <!-- Nuqta (Dot of Noon) -->
      <path d="M -48 6 L -44 2 L -40 6 L -44 10 Z" fill="url(#goldSheen)"/>

      <!-- Ar-Rahim (الرحيم) -->
      <!-- Alif of Ar-Rahim -->
      <path d="M -85 -36 C -85 -41, -83 -45, -80 -47 C -78 -45, -79 -39, -79 -20 L -79 4 C -79 8, -83 10, -85 8 C -86 6, -85 0, -85 -36 Z"/>
      <!-- Lam -->
      <path d="M -98 -34 C -98 -39, -96 -43, -93 -45 C -91 -43, -92 -37, -92 -18 L -92 2 C -92 7, -96 9, -98 7 L -98 -34 Z"/>
      <!-- Ra of Rahim -->
      <path d="M -102 3 C -100 -2, -96 -5, -92 -5 C -87 -5, -84 -1, -85 5 C -87 13, -95 21, -108 26 C -118 30, -130 31, -142 30 L -140 25 C -130 26, -120 25, -112 21 C -105 17, -100 12, -100 7 C -100 2, -103 2, -105 4 Z"/>
      <!-- Ha of Rahim -->
      <path d="M -115 -2 C -112 -7, -108 -11, -102 -11 C -97 -11, -94 -7, -95 -2 C -96 4, -101 7, -108 8 C -114 9, -120 7, -125 3 C -129 -1, -132 -6, -130 -12 C -128 -18, -121 -22, -112 -21 C -105 -20, -101 -16, -102 -11 C -103 -7, -107 -5, -111 -6 C -114 -7, -115 -10, -114 -12 C -113 -14, -110 -15, -107 -14 C -106 -14, -106 -12, -107 -11 C -108 -11, -109 -10, -110 -9 C -111 -7, -110 -6, -107 -6 C -104 -6, -101 -9, -102 -13 C -103 -16, -107 -18, -112 -18 C -118 -17, -122 -14, -123 -9 C -124 -5, -122 -1, -118 2 L -115 -2 Z"/>
      <!-- Ya of Rahim with two dots underneath -->
      <path d="M -132 4 C -130 1, -126 -1, -122 0 C -118 1, -116 5, -118 9 C -121 16, -128 22, -138 25 C -146 27, -156 27, -165 25 L -164 20 C -157 22, -149 22, -143 20 C -137 18, -133 14, -133 10 C -133 7, -135 6, -137 8 Z"/>
      <!-- Two Dots (Nuqtas) of Ya -->
      <path d="M -140 32 L -136 28 L -132 32 L -136 36 Z" fill="url(#goldSheen)"/>
      <path d="M -128 32 L -124 28 L -120 32 L -124 36 Z" fill="url(#goldSheen)"/>

      <!-- Meem final tail of Rahim dipping downward gracefully -->
      <path d="M -160 12 C -155 12, -150 16, -148 21 C -146 27, -148 34, -152 42 C -156 50, -162 58, -168 66 L -172 63 C -167 56, -161 48, -158 41 C -155 35, -154 30, -155 26 C -156 22, -159 20, -162 19 C -166 18, -170 20, -172 23 C -174 26, -174 30, -172 34 L -176 36 C -179 30, -179 23, -176 17 C -173 13, -167 11, -160 12 Z"/>

      <!-- Diacritical Marks / Tashkeel & Fathas / Dammah / Kasrah in Gold -->
      <g fill="url(#goldSheen)" opacity="0.95">
        <!-- Shaddah over Allah Lam -->
        <path d="M -44 -44 C -43 -47, -41 -47, -40 -45 C -39 -47, -37 -47, -36 -45 L -36 -41 L -44 -41 Z"/>
        <!-- Dagger Alif over Allah -->
        <path d="M -38 -48 L -37 -56 L -35 -56 L -36 -48 Z"/>
        <!-- Shaddah over Rahman Ra -->
        <path d="M 52 -12 C 53 -15, 55 -15, 56 -13 C 57 -15, 59 -15, 60 -13 L 60 -9 L 52 -9 Z"/>
        <!-- Fatha over Seen -->
        <path d="M 108 -30 L 118 -36 L 120 -33 L 110 -27 Z"/>
        <!-- Kasrah under Ba -->
        <path d="M 124 26 L 134 20 L 136 23 L 126 29 Z"/>
        <!-- Sukun over Meem -->
        <circle cx="82" cy="-32" r="3" fill="none" stroke="url(#goldSheen)" stroke-width="1.2"/>
        <!-- Shaddah over Rahim Ra -->
        <path d="M -94 -12 C -93 -15, -91 -15, -90 -13 C -89 -15, -87 -15, -86 -13 L -86 -9 L -94 -9 Z"/>
      </g>
    </g>
  </g>

  <!-- Fine Subtitle Inscription Under Crest: In the Name of Allah, the Most Gracious, the Most Merciful -->
  <text x="270" y="200" 
        font-family="'Cormorant Garamond', 'Cinzel', Georgia, serif" 
        font-size="11.5" 
        font-style="italic" 
        letter-spacing="3.5" 
        text-anchor="middle" 
        fill="#7A6855">
    IN THE NAME OF ALLAH, THE MOST BENEFICENT, THE MOST MERCIFUL
  </text>
</svg>

