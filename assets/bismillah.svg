<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Cormorant+Garamond:ital,wght@1,400&amp;family=Plus+Jakarta+Sans:wght@500&amp;display=swap');
      .arabic-basmala {
        font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif;
        font-size: 42px;
        fill: #1C1917;
        text-anchor: middle;
        direction: rtl;
      }
      .translation {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 9.5px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        fill: #9A7B4F;
        text-anchor: middle;
      }
      .hairline {
        stroke: #E5DFD3;
        stroke-width: 1px;
      }
      .bronze-accent {
        fill: #9A7B4F;
      }
    </style>
  </defs>

  <!-- Clean Architectural Editorial Canvas -->
  <rect width="100%" height="100%" fill="#F7F5F0"/>

  <!-- Subtle Top & Bottom Hairline Rules -->
  <line x1="200" y1="24" x2="400" y2="24" class="hairline"/>
  <circle cx="300" cy="24" r="2" class="bronze-accent"/>

  <!-- Authentic Classical Vocalized Basmala (Amiri Naskh) -->
  <text x="300" y="86" class="arabic-basmala">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</text>

  <!-- Fine Editorial English Translation -->
  <text x="300" y="124" class="translation">IN THE NAME OF ALLAH, THE MOST BENEFICENT, THE MOST MERCIFUL</text>

  <line x1="240" y1="142" x2="360" y2="142" class="hairline"/>
</svg>
